version: 2

sources:
  - name: newsapi_raw
    description: "Raw NewsAPI articles loaded by dlt into DuckDB."
    schema: newsapi_raw
    tables:
      - name: articles_us_en
        description: "US English AI-topic articles."
        columns:
          - name: _dlt_id
            data_type: varchar
            tests:
              - not_null
              - unique
          - name: _dlt_load_id
            data_type: varchar
            tests:
              - not_null
          - name: title
            data_type: varchar
          - name: url
            data_type: varchar
          - name: published_at
            data_type: timestamp

      - name: articles_de_de
        description: "German AI-topic articles."
        columns:
          - name: _dlt_id
            data_type: varchar
            tests:
              - not_null
              - unique
          - name: _dlt_load_id
            data_type: varchar
            tests:
              - not_null
          - name: title
            data_type: varchar
          - name: url
            data_type: varchar
          - name: published_at
            data_type: timestamp
