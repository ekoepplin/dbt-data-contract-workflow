[project]
name = "dbt-data-contract-workflow"
version = "0.1.0"
description = "Demo: ODCS v3.1.0 data contracts + datacontract-cli + dbt-duckdb, sourced via dlt from NewsAPI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dlt[duckdb]>=1.0.0",
    "newsapi-python>=0.2.7",
    "dbt-core>=1.8.0",
    "dbt-duckdb>=1.8.0",
    "datacontract-cli[duckdb]>=0.10.0",
    "loguru>=0.7.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dlt_ingest"]
